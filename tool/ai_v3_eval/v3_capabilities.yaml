known_discrepancies:
  - id: discrepancy.mix_action_docs
    severity: low
    finding: mixing_result.dart documentation omits hard_reset_row_fx although LocalMixingModel and AudioEditor support it.
  - id: discrepancy.contract_scope
    severity: architectural
    finding: the 87-operation action contract records mix_goal.mix_request but not GoalVector fields, mixing engines, or concrete MixActions.
  - id: discrepancy.atomicity
    severity: medium
    finding: V1 ordered and asynchronous actions do not share a universal atomic rollback/readback contract.
  - id: discrepancy.alias_authority
    severity: medium
    finding: legacy alias and payload normalization exists in Python, CloudLlmService, AssistantActionUtils, and AudioEditor; automation create currently means set_points before routing but create_clip in the editor normalizer.
  - id: discrepancy.capture_coverage
    severity: informational
    finding: only 14 of 87 canonical operations appear in the current 34 V1 comparison captures.
  - id: discrepancy.hosted_plugins
    severity: architectural
    finding: installed plugin discovery and arbitrary parameter semantics are broader than the typed built-in V3 prototype effect command.
  - id: discrepancy.model_naming
    severity: informational
    finding: source code identifies an ONNX apply classifier and magnitude regressor; the inventory does not assume a regression-tree implementation without model metadata proving it.

migration_order:
  - {phase: prototype, capabilities: [existing typed V3 commands, stable IDs, preparation, confirmation, atomic local execution, readback]}
  - {phase: adaptive_core, capabilities: [immutable planning snapshot, compact core, exact 17 common commands, capability-domain directory]}
  - {phase: bounded_retrieval, capabilities: [one batched same-planner retrieval round, typed snapshot facts, domain command schemas]}
  - {phase: core_editing, capabilities: [transport, row lifecycle/state, advanced clip editing, MIDI editing, effect instances, general automation]}
  - {phase: mixing_vertical_slice, capabilities: [GoalVector, LocalMixingModel, local/remote magnitude refinement, reference-track protection, MixActions]}
  - {phase: musical_generation, capabilities: [MusicSpecV3, provider-neutral realization, evaluated GPT/curated/hybrid providers, broader instruments and samples]}
  - {phase: staged_audio_jobs, capabilities: [stem separation, audio-to-MIDI, cleanup and rendered clip processing]}
  - {phase: scale, capabilities: [large catalogs/projects, retrieval result limits, token and latency gates]}
