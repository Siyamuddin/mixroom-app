mix_goal_contract:
  id: mixing.goal_vector
  category: mixing
  purpose: Structured semantic request consumed by Mixroom's deterministic/learned mixing stack.
  inputs: [intents, target, intensity, execution_profile, audibility, reset_fx, optional reference target/mode/closeness]
  fields:
    type: mix_request
    intents:
      fields: [kind, direction, descriptor, confidence]
      kinds: [gain, pan, eq, reverb, delay, distortion, deesser, compressor, limiter, clipper, balance]
      directions: [up, down, left, right, center, widen, narrow, remove, "null"]
      eq_descriptors: [mud_cut, box_cut, boom_cut, harsh_cut, presence_boost, air_boost, warmth_boost, thin_fix, dull_fix, low_cut, high_cut, "null"]
      non_eq_descriptors: ["null"]
    target: {scopes: [auto, row, group, master], fields: [role, row_index, group_id, group_name, scope, confidence]}
    intensity: {minimum: 0.0, maximum: 1.0, default: 0.5}
    execution_profile: [producer_safe, creative_bold, experimental_extreme]
    audibility: [subtle, noticeable, obvious, extreme]
    style_tags: {reachability: accepted_by_downstream_normalizers_but_not_declared_in_current_gpt_tool_schema, maximum: 8, maximum_token_length: 40}
    destructive_ok: {reachability: accepted_by_downstream_normalizers_but_not_declared_in_current_gpt_tool_schema, type: boolean}
    reset_fx: boolean
    reference_target: [row_index, prefer_selected, confidence]
    reference_mode: [tone, loudness, width, glue, full_mix]
    reference_closeness: [loose, balanced, close]
  target_semantics: processing target and reference target are resolved independently; the reference is protected from processing
  context: row interpretation, audio features, selection, groups, effects, master state
  implementation: {llm: lib/ai/cloud_llm_service.dart, proxy: backend/llm_proxy/src/handlers/api_responses.py, dart: lib/models/goal_vector.dart, flutter: lib/ai/chat_pipeline.dart, executor: lib/ai/local_mixing_model.dart}
  execution: {kind: heuristic_plan_with_optional_magnitude_refinement, confirmation: mode propose or execute, undo_or_rollback: editor undo snapshot, readback: MixApplyReport}
  dependencies: [project has occupied audio or MIDI material]
  evidence: [test/cloud_llm_service_test.dart, test/assistant_action_flow_test.dart, test/local_mixing_model_reference_test.dart]
  status: implemented_unverified
  gaps: [style_tags and destructive_ok exist downstream but are not currently advertised in the GPT-facing mix tool schema]
  v3: {disposition: prototype_supported, command: mix.apply_goal, adaptive_retrieval: shadow_supported, phase: mixing_vertical_slice, dependency: none}

