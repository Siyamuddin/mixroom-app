schema_version: ai_v3_capability_inventory_v2
status: v1_audit_complete
last_reviewed: "2026-07-24"
canonical_action_contract: backend/llm_proxy/src/common/llm_contract.py
human_readable_matrix: docs/engineering/ai_v3_capability_matrix.md
v3_architecture: docs/engineering/adr/0002-ai-v3-architecture.md
v3_adaptive_specification: docs/engineering/ai_v3_adaptive_planner.md
v3_adaptive_machine_contract: tool/ai_v3_eval/v3_adaptive_architecture.yaml
scope:
  included: Mixroom DAW project-chat AI, deterministic DAW AI entrypoints, mixing engines, and audio/context models used by those paths
  excluded: standalone Video Editor AI in lib/ai/video_editor_ai.dart
  exclusion_reason: Video Editor AI has a separate prompt, tool contract, state model, and executor; it is not part of the V1-to-V3 DAW migration

# An operation inherits the implementation, execution, dependencies, evidence,
# and default status fields of its family. Operation fields override family
# fields. This keeps the 87-operation ledger readable without hiding omissions.
inventory_rules:
  family_count: 22
  canonical_operation_count: 87
  v3_prototype_command_count: 53
  completion_rule: every accepted, emitted, routed, or executed capability has an explicit disposition
  verified_rule: verified requires real editor execution plus undo_or_rollback and readback evidence
  allowed_v1_statuses: [verified, implemented_unverified, partial, broken, non_mutating, context_only, unreachable, test_only]
  allowed_v3_dispositions: [prototype_supported, typed_command_needed, mix_engine_integration_needed, context_needed, retrieval_candidate, external_async_workflow, respond_only, unsupported_intentionally]

authoritative_sources:
  llm_contract: [lib/ai/debug_system_prompt.dart, lib/ai/cloud_llm_service.dart, backend/llm_proxy/src/common/llm_contract.py]
  canonical_actions: [lib/ai/debug_system_prompt.dart, lib/ai/cloud_llm_service.dart, backend/llm_proxy/src/common/llm_contract.py, backend/llm_proxy/src/handlers/api_responses.py]
  proxy_normalization: [backend/llm_proxy/src/handlers/api_responses.py]
  flutter_routing: [lib/ai/chat_pipeline.dart, lib/ai/cloud_llm_service.dart, lib/ai/assistant_action_timeline_reducer.dart]
  editor_execution: [lib/screens/audio_editor.dart]
  mixing: [lib/models/goal_vector.dart, lib/models/mixing_result.dart, lib/ai/local_mixing_model.dart, lib/ai/magnitude_predictor.dart]
  captures: [tool/ai_v3_captures.local]

entry_surfaces:
  - id: entry.daw_assistant_actions
    category: entry_surface
    purpose: Return one or more ordered concrete DAW action bundles.
    examples: [mute and rename two rows, create a row then place a sample]
    inputs: [assistant_message, actions, optional calls wrapper]
    target_semantics: delegated to each action family
    context: project snapshot, selection snapshot, capability list, recent conversation, pending proposal
    implementation: {llm: lib/ai/cloud_llm_service.dart, proxy: backend/llm_proxy/src/handlers/api_responses.py, dart: lib/ai/cloud_llm_service.dart, flutter: lib/ai/chat_pipeline.dart, executor: lib/screens/audio_editor.dart}
    execution: {kind: ordered_editor_actions, confirmation: action_dependent, undo_or_rollback: handler_dependent, readback: partial}
    dependencies: [OpenAI response tool call, advertised client capabilities]
    evidence: [backend/llm_proxy/tests/test_llm_contract_routing.py, test/cloud_llm_service_test.dart, test/assistant_action_flow_test.dart, tool/ai_v3_captures.local]
    status: implemented_unverified
    gaps: [V1 actions use heterogeneous payloads and do not share universal atomic rollback or readback]
    v3: {disposition: typed_command_needed, phase: incremental_surface_expansion, dependency: typed operation contracts}

  - id: entry.mix_model_request
    category: entry_surface
    purpose: Express subjective sonic goals which Mixroom resolves into concrete mix actions.
    examples: [make the vocal warmer, match this track's tone to the reference]
    inputs: [mode, assistant_message, asks_permission, actions.goal]
    target_semantics: row, group, master, auto, plus a separately protected reference target
    context: project analysis, row interpretations, selection, effects, reference analysis
    implementation: {llm: lib/ai/cloud_llm_service.dart, proxy: backend/llm_proxy/src/handlers/api_responses.py, dart: lib/models/goal_vector.dart, flutter: lib/ai/chat_pipeline.dart, executor: lib/screens/audio_editor.dart}
    execution: {kind: heuristic_then_optional_learned_refinement, confirmation: propose_or_execute, undo_or_rollback: editor_undo_snapshot, readback: apply_report}
    dependencies: [LocalMixingModel, optional magnitude predictor]
    evidence: [test/cloud_llm_service_test.dart, test/assistant_action_flow_test.dart, test/local_mixing_model_reference_test.dart, backend/llm_proxy/tests/test_mix_resolve.py]
    status: implemented_unverified
    gaps: [model output quality and complete atomicity require workflow evaluation]
    v3: {disposition: prototype_supported, command: mix.apply_goal, adaptive_retrieval: shadow_supported, phase: mixing_vertical_slice, dependency: none}

  - id: entry.informational_response
    category: entry_surface
    purpose: Answer factual, musical, explanatory, or tutorial questions without mutation.
    examples: [report current BPM, explain how to add automation]
    inputs: [assistant_message]
    target_semantics: optional factual project target
    context: project snapshot, selection, recent conversation
    implementation: {llm: lib/ai/cloud_llm_service.dart, proxy: backend/llm_proxy/src/handlers/api_responses.py, dart: lib/ai/chat_pipeline.dart, flutter: lib/ai/chat_pipeline.dart, executor: none}
    execution: {kind: non_mutating, confirmation: none, undo_or_rollback: not_applicable, readback: factual_context_only}
    dependencies: [OpenAI response]
    evidence: [backend/llm_proxy/tests/test_llm_contract_routing.py, test/cloud_llm_service_test.dart, tool/ai_v3_captures.local]
    status: non_mutating
    gaps: [factual correctness depends on context completeness]
    v3: {disposition: respond_only, phase: prototype, dependency: CoreContextV3}

  - id: entry.tutorial
    category: entry_surface
    purpose: Return UI guidance or educational steps without editor mutation.
    examples: [show me how to split a clip]
    inputs: [topic, optional step or UI target]
    target_semantics: UI feature rather than mutable project object
    context: platform and visible editor state
    implementation: {llm: lib/ai/cloud_llm_service.dart, proxy: backend/llm_proxy/src/handlers/api_responses.py, dart: lib/ai/assistant_action_timeline_reducer.dart, flutter: lib/screens/audio_editor.dart, executor: tutorial UI}
    execution: {kind: non_mutating, confirmation: none, undo_or_rollback: not_applicable, readback: none}
    dependencies: [tutorial content and UI availability]
    evidence: [test/assistant_action_flow_test.dart, test/assistant_action_timeline_reducer_test.dart]
    status: non_mutating
    gaps: [tutorial coverage is not identical to editor capability coverage]
    v3: {disposition: respond_only, phase: informational_surface, dependency: compact UI capability context}

  - id: entry.clarify
    category: entry_surface
    purpose: Ask for missing information when different answers would change the action.
    examples: [which of the duplicate tracks do you mean]
    inputs: [question, optional options]
    target_semantics: unresolved or contradictory target
    context: project identities, selection, conversation
    implementation: {llm: lib/ai/cloud_llm_service.dart, proxy: backend/llm_proxy/src/handlers/api_responses.py, dart: lib/ai/chat_pipeline.dart, flutter: lib/screens/audio_editor.dart, executor: none}
    execution: {kind: non_mutating, confirmation: none, undo_or_rollback: not_applicable, readback: none}
    dependencies: [conversation continuation]
    evidence: [test/cloud_llm_service_test.dart, test/assistant_action_flow_test.dart]
    status: non_mutating
    gaps: [V1 can falsely clarify when targeting or payload normalization fails]
    v3: {disposition: respond_only, phase: prototype, dependency: stable identity context}

  - id: entry.compound_calls
    category: entry_surface
    purpose: Preserve ordered concrete-edit and sonic-mix calls in one assistant turn.
    examples: [create drums then perform a sonic mix pass]
    inputs: [multiple tool calls or calls wrapper]
    target_semantics: per child call
    context: shared request and project snapshot
    implementation: {llm: lib/ai/cloud_llm_service.dart, proxy: backend/llm_proxy/src/handlers/api_responses.py, dart: lib/ai/chat_pipeline.dart, flutter: lib/screens/audio_editor.dart, executor: sequential handlers}
    execution: {kind: ordered_multi_surface, confirmation: child_dependent, undo_or_rollback: not_universally_atomic, readback: child_dependent}
    dependencies: [both tool surfaces enabled]
    evidence: [test/cloud_llm_service_test.dart, test/assistant_action_flow_test.dart]
    status: partial
    gaps: [V1 does not guarantee one transaction across every heterogeneous or asynchronous child]
    v3: {disposition: typed_command_needed, phase: transaction_expansion, dependency: atomic local bundle plus staged external jobs}

  - id: entry.one_button_mix
    category: deterministic_entry_surface
    purpose: Submit the fixed professional-release mix request through V1 and automatically apply the resulting mix actions.
    examples: [One-Button Mix from the editor]
    inputs: [current project state, fixed mix prompt, selected UI profile]
    target_semantics: broad occupied-project mix; concrete targets are resolved by mix_model_request and the mixing stack
    context: project analysis, selection, effects, row capacity, library and capability snapshots
    implementation: {llm: fixed prompt through lib/ai/chat_pipeline.dart, proxy: ai_feature one_button_mix normalized to ai_chat, dart: lib/ai/chat_pipeline.dart, flutter: lib/screens/audio_editor.dart, executor: applyMixingResult}
    execution: {kind: fixed_prompt_then_auto_apply_mix, confirmation: dedicated pre-run UI confirmation, undo_or_rollback: editor mix undo snapshot, readback: MixApplyReport}
    dependencies: [mix_model_request, LocalMixingModel, optional magnitude predictor]
    evidence: [lib/screens/audio_editor.dart, test/assistant_action_flow_test.dart]
    status: implemented_unverified
    gaps: [the current profile selector exposes one profile and the selected profile is not included in the submitted fixed prompt]
    v3: {disposition: mix_engine_integration_needed, phase: mixing_vertical_slice, dependency: typed broad-mix goal and explicit auto-apply policy}

