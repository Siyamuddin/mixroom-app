openapi: 3.0.3
info:
  title: Mixroom Subscription API
  version: 1.0.0
  description: Canonical entitlement and billing API for Mixroom clients.
servers:
  - url: https://api.mixroom.ai
paths:
  /v1/contact:
    options:
      summary: CORS preflight for public contact and support form submissions
      responses:
        '204':
          description: Origin is allowed
        '403':
          description: Origin is not allowed
    post:
      summary: Submit a public contact or support form message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, subject, message, email]
              properties:
                source:
                  type: string
                  enum: [contact, support]
                subject:
                  type: string
                message:
                  type: string
                email:
                  type: string
                  format: email
                  description: Visitor reply-to email address. This is not used as the sender.
                pageUrl:
                  type: string
                  nullable: true
                locale:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Message accepted and sent
        '400':
          description: Validation error
        '429':
          description: Too many submissions
        '502':
          description: Email delivery failed
  /v1/users/me:
    get:
      summary: Get or create the current app user profile snapshot
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
    patch:
      summary: Update the current app user profile snapshot
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfilePatch'
      responses:
        '200':
          description: Updated user profile snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Validation error
        '409':
          description: Username already claimed
    delete:
      summary: Delete the current app user profile and related Mixroom-side account records
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account records deleted
        '409':
          description: Active paid subscription must be cancelled first
  /v1/users/me/producer-capture-ui-access:
    get:
      summary: Check whether the signed-in user is allowlisted for Producer Capture UI
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Producer capture UI access for the current user
  /v1/entitlements/me:
    get:
      summary: Get current user's canonical entitlement snapshot
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Entitlement snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlement'
  /v1/feature-flags:
    get:
      summary: Get remote app feature flags for the signed-in user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: App feature flag config
  /v1/billing/catalog:
    get:
      summary: Get billing catalog, plan configuration, and support metadata
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Billing catalog
  /v1/organizations/me:
    get:
      summary: Get organizations and memberships available to the signed-in user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Organization access snapshot
  /v1/workspaces/me:
    get:
      summary: Get workspaces available to the signed-in user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Workspace access snapshot
  /v1/cloud-projects/me:
    get:
      summary: Get cloud projects available to the signed-in user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cloud project access snapshot
    post:
      summary: Start a direct-to-S3 .mixroom cloud project upload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, size_bytes]
              properties:
                project_id:
                  type: string
                local_project_id:
                  type: string
                name:
                  type: string
                size_bytes:
                  type: integer
      responses:
        '200':
          description: Presigned upload URL and cloud project metadata
        '403':
          description: Plan or cloud storage quota does not allow the upload
  /v1/education/me:
    get:
      summary: Get education organizations and student seats managed by the signed-in teacher
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Education teacher admin snapshot
        '403':
          description: Teacher access required
  /v1/education/me/invites:
    post:
      summary: Invite a student or manage a shared class link
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id]
              properties:
                organization_id:
                  type: string
                action:
                  type: string
                  enum: [class_link_get, class_link_create, class_link_revoke]
                  description: Omit to send an individual email invitation. Class link actions do not send email or reserve a seat.
                email:
                  type: string
                  format: email
                  description: Required when action is omitted.
      responses:
        '200':
          description: Pending student invitation or shared class_invite record
        '403':
          description: Teacher access required
  /v1/education/me/memberships:
    post:
      summary: Update an existing education student seat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id, user_id, status]
              properties:
                organization_id:
                  type: string
                user_id:
                  type: string
                status:
                  type: string
                  enum: [pending, active, inactive, revoked, removed]
      responses:
        '200':
          description: Updated student seat
        '403':
          description: Teacher access required
        '404':
          description: Student membership not found
  /v1/education/invites/{invite_token}:
    get:
      summary: Get education invite details
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: invite_token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Education invite detail
        '404':
          description: Education invite not found
  /v1/education/invites/{invite_token}/accept:
    post:
      summary: Accept an individual or shared class invitation for the signed-in user
      description: Shared class links grant one student seat per account while capacity remains. Removed or expired student access cannot be restored with a shared link. Existing active members are returned unchanged.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: invite_token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Active student seat membership
        '404':
          description: Education invite not found
  /v1/cloud-projects/{project_id}:
    get:
      summary: Get one accessible cloud project document and metadata
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cloud project detail
    put:
      summary: Update one accessible cloud project document with optimistic locking
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document, expected_revision]
              properties:
                expected_revision:
                  type: integer
                name:
                  type: string
                document:
                  type: object
      responses:
        '200':
          description: Cloud project updated
    delete:
      summary: Delete a personal .mixroom cloud project
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cloud project deleted
  /v1/cloud-projects/{project_id}/complete:
    post:
      summary: Complete a .mixroom cloud project upload after S3 PUT
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cloud project upload committed
  /v1/cloud-projects/{project_id}/download:
    get:
      summary: Get a presigned .mixroom bundle download URL
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cloud project download URL
  /v1/feedback:
    post:
      summary: Submit product feedback or a bug report
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, source, message]
              properties:
                category:
                  type: string
                  enum: [feedback, bug_report]
                source:
                  type: string
                  enum: [home, account, daw_chat]
                message:
                  type: string
                  maxLength: 1500
                allow_email_contact:
                  type: boolean
                  description: Whether the user consents to email follow-up about this submission.
                client:
                  type: object
                context:
                  type: object
                screenshot:
                  type: object
      responses:
        '200':
          description: Feedback accepted
  /v1/producer-training/sessions/uploads:
    post:
      summary: Reserve an idempotent encrypted producer-training bundle upload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProducerTrainingUploadContract'
      responses:
        '201':
          description: Signed S3 upload URL and required headers
        '400':
          description: Invalid capture contract
        '409':
          description: Session ID was previously reserved with different content
  /v1/producer-training/sessions/{session_id}/complete:
    post:
      summary: Verify and promote an uploaded producer-training bundle
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProducerTrainingUploadContract'
      responses:
        '202':
          description: Bundle checksum and capture contract verified
  /v1/producer-training/sessions/{session_id}:
    delete:
      summary: Revoke and delete a producer-training session and its media
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session objects deleted and deletion status recorded
  /v1/internal/admin/overview:
    get:
      summary: Internal admin dashboard overview
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Internal operational overview
  /v1/internal/admin/feedback:
    get:
      summary: Internal admin feedback submissions
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: submission_id
          schema:
            type: string
      responses:
        '200':
          description: Feedback submissions or a single submission detail
  /v1/internal/admin/users:
    get:
      summary: Internal admin user search
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: query
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: Matching internal admin user records
  /v1/internal/admin/users/create-username-account:
    post:
      summary: Create an admin-provisioned username/password account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, display_name, password]
              properties:
                username:
                  type: string
                display_name:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Username account created
  /v1/internal/admin/users/delete:
    post:
      summary: Tombstone-delete a user account from internal admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, reason]
              properties:
                user_id:
                  type: string
                reason:
                  type: string
                force:
                  type: boolean
      responses:
        '200':
          description: User deleted and tombstoned
        '409':
          description: Active paid subscription requires explicit force flag
  /v1/internal/admin/users/grant-prompts:
    post:
      summary: Add extra AI prompt allowance to a user from internal admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, prompt_count]
              properties:
                user_id:
                  type: string
                prompt_count:
                  type: integer
      responses:
        '200':
          description: Prompt allowance granted
  /v1/internal/admin/settings/ai-prompt-limits:
    get:
      summary: Get internal admin AI prompt limit settings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current AI prompt limit settings
    put:
      summary: Update internal admin AI prompt limit settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [free_daily_prompt_limit, free_weekly_prompt_limit]
              properties:
                free_daily_prompt_limit:
                  type: integer
                free_weekly_prompt_limit:
                  type: integer
      responses:
        '200':
          description: AI prompt limit settings updated
    delete:
      summary: Remove the free prompt-limit override and use deployed defaults
      security:
        - bearerAuth: []
      responses:
        '200':
          description: AI prompt-limit override removed
  /v1/internal/admin/settings/ai-runtime:
    get:
      summary: Get internal admin AI runtime settings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current AI runtime settings
    put:
      summary: Update internal admin AI runtime settings for a feature
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feature]
              properties:
                feature:
                  type: string
                model_override:
                  type: string
                system_prompt_override:
                  type: string
                max_output_tokens_override:
                  type: integer
                temperature_override:
                  type: number
                reasoning_effort_override:
                  type: string
                prompt_cache_retention_override:
                  type: string
      responses:
        '200':
          description: AI runtime settings updated
  /v1/internal/admin/settings/producer-capture-whitelist:
    get:
      summary: Get internal admin producer capture UI username whitelist
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current producer capture whitelist settings
    put:
      summary: Update internal admin producer capture UI username whitelist
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usernames]
              properties:
                usernames:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Producer capture whitelist settings updated
  /v1/internal/admin/settings/billing-catalog:
    get:
      summary: Get internal admin billing catalog and support settings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Billing catalog and support settings
    put:
      summary: Replace internal admin billing catalog and support settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plans, products, offers, support]
              properties:
                plans:
                  type: array
                  items:
                    type: object
                products:
                  type: array
                  items:
                    type: object
                offers:
                  type: array
                  items:
                    type: object
                support:
                  type: object
      responses:
        '200':
          description: Billing catalog updated
  /v1/internal/admin/settings/feature-flags:
    get:
      summary: Get internal admin app feature flag settings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: App feature flag settings
    put:
      summary: Update internal admin app feature flag settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flags]
              properties:
                flags:
                  type: object
                  additionalProperties:
                    type: boolean
      responses:
        '200':
          description: App feature flag settings updated
  /v1/internal/admin/billing/organizations:
    get:
      summary: List internal admin organizations for team billing
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Organization records
    post:
      summary: Create or update an internal admin organization for team billing
      description: Optional access_expires_at sets a future UTC end timestamp; empty clears it and omission preserves it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Organization saved
  /v1/internal/admin/billing/education-provisioning:
    post:
      summary: Provision an Education organization, teacher, and classroom workspace
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - seat_limit
              properties:
                organization_id:
                  type: string
                name:
                  type: string
                seat_limit:
                  type: integer
                  minimum: 1
                  description: Custom student count. Teachers do not consume student seats.
                  example: 60
                access_expires_at:
                  type: string
                  description: Optional future ISO timestamp with timezone. Empty means no end date. Applies to teacher and student access.
                teacher_user_id:
                  type: string
                  description: Legacy existing-account grant. Omit for email invitations.
                teacher_email:
                  type: string
                  format: email
                  description: Required for teacher invitations, including teachers without an account.
                invite_teacher:
                  type: boolean
                  description: Send an email-bound teacher invitation. Ignores teacher_user_id when true.
                workspace_id:
                  type: string
                workspace_name:
                  type: string
      responses:
        '200':
          description: Education organization provisioned
  /v1/internal/admin/billing/education-invites:
    post:
      summary: Review a student roster or send one Education invitation
      description: >-
        Employees review up to 500 emails without writing records. The dashboard
        sends each new invitation sequentially and displays individual results.
        Existing pending invites require explicit resend=true; active members
        are skipped. Email delivery failures keep the reserved seat and invite link.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, organization_id]
              properties:
                action:
                  type: string
                  enum: [preview, send, resend_teacher, class_link_get, class_link_create, class_link_revoke]
                organization_id:
                  type: string
                emails:
                  type: array
                  minItems: 1
                  maxItems: 500
                  description: Required for preview.
                  items:
                    type: string
                email:
                  type: string
                  description: Required for send.
                locale:
                  type: string
                  enum: [en, ko]
                  default: en
                access_expires_at:
                  type: string
                  description: Optional future ISO timestamp for new students. Empty inherits the class deadline. Cannot exceed that deadline. Resends keep the existing period.
                invite_token:
                  type: string
                  description: Required for resend_teacher. Must identify a pending teacher invitation in this organization.
                resend:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Roster review or individual invitation result, including email failure or skipped status
        '400':
          description: Invalid roster, inactive school, or no available seats
        '403':
          description: Employee is not allowlisted
  /v1/internal/admin/billing/memberships:
    get:
      summary: List internal admin organization memberships
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Membership records
    post:
      summary: Create or update an internal admin organization membership
      description: Optional access_expires_at sets a student end timestamp; empty inherits the organization period and omission preserves the saved period.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Membership saved
  /v1/internal/admin/billing/workspaces:
    get:
      summary: List internal admin team workspaces
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Workspace records
    post:
      summary: Create or update an internal admin team workspace
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Workspace saved
  /v1/internal/admin/billing/cloud-projects:
    get:
      summary: List internal admin cloud project records
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cloud project records
    post:
      summary: Create or update an internal admin cloud project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Cloud project saved
  /v1/billing/web/checkout-session:
    post:
      summary: Create web checkout session (Paddle/Toss)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [region_code]
              properties:
                region_code:
                  type: string
                product_code:
                  type: string
                success_url:
                  type: string
                cancel_url:
                  type: string
      responses:
        '200':
          description: Checkout session
  /v1/billing/web/subscription/change:
    post:
      summary: Change the signed-in user's active web subscription
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_code]
              properties:
                subscription_id:
                  type: string
                product_code:
                  type: string
                additional_seats:
                  type: integer
                extra_storage_tb:
                  type: integer
                proration_billing_mode:
                  type: string
      responses:
        '200':
          description: Subscription changed or provider checkout required
  /v1/billing/web/subscription/change/preview:
    post:
      summary: Preview a signed-in user's web subscription plan change
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_code]
              properties:
                subscription_id:
                  type: string
                product_code:
                  type: string
                additional_seats:
                  type: integer
                extra_storage_tb:
                  type: integer
                proration_billing_mode:
                  type: string
      responses:
        '200':
          description: Plan change preview with current plan, target plan, amount due now, and next billing details
  /v1/billing/mobile/apple/verify:
    post:
      summary: Verify Apple subscription transaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction_jws]
              properties:
                transaction_jws:
                  type: string
                product_id:
                  type: string
                app_account_token:
                  type: string
  /v1/billing/mobile/google/verify:
    post:
      summary: Verify Google subscription purchase token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purchase_token, product_id]
              properties:
                purchase_token:
                  type: string
                product_id:
                  type: string
                package_name:
                  type: string
                obfuscated_account_id:
                  type: string
  /v1/billing/restore:
    post:
      summary: Trigger restore from provider account
      security:
        - bearerAuth: []
  /v1/billing/portal-url:
    get:
      summary: Resolve provider management URL
      security:
        - bearerAuth: []
  /v1/webhooks/apple:
    post:
      summary: Apple ASSN V2 webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signedPayload]
              properties:
                signedPayload:
                  type: string
  /v1/webhooks/google:
    post:
      summary: Google RTDN webhook
