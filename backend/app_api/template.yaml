          GOOGLE_SERVICE_ACCOUNT_SECRET_ARN: !Ref GoogleServiceAccountSecretArn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mixroom/*/toss/secret-key
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mixroom/payment-credentials/${StageName}/toss/*
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mixroom/*/postmark/server-token
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mixroom/*/google-play/service-account
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
                  kms:CallerAccount: !Ref AWS::AccountId
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EntitlementsCurrentTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PurchaseTokensTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CustomerLinksTable
        - DynamoDBReadPolicy:
            TableName: !Ref CatalogMappingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CollaborationTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ReconciliationJobsTable
        - !If
          - HasTossSecretKeySecretArn
          - Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref TossSecretKeySecretArn
          - !Ref AWS::NoValue
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:mixroom/payment-credentials/${StageName}/*
        - !If
          - HasPostmarkServerTokenSecretArn
          - Statement:
              - Effect: Allow
                Action:
