  BillingApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/api_billing.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BillingEventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EntitlementsCurrentTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CatalogMappingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CustomerLinksTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PurchaseTokensTable
        - DynamoDBReadPolicy:
            TableName: !Ref AuthAccountsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthSessionsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt BillingProjectionQueue.QueueName
        - !If
          - HasBillingSecrets
          - Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !If [HasAppleRootCaSecretArn, !Ref AppleRootCaSecretArn, !Ref AWS::NoValue]
                  - !If [HasAppleSharedSecretSecretArn, !Ref AppleSharedSecretSecretArn, !Ref AWS::NoValue]
                  - !If [HasGoogleServiceAccountSecretArn, !Ref GoogleServiceAccountSecretArn, !Ref AWS::NoValue]
          - !Ref AWS::NoValue
        - !If
          - HasAppAuthSecretArn
          - Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref AppAuthSecretArn
          - !Ref AWS::NoValue
      Events:
        BillingCheckoutSession:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/billing/web/checkout-session
            Method: post
        BillingAppleVerify:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/billing/mobile/apple/verify
            Method: post
        BillingGoogleVerify:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/billing/mobile/google/verify
            Method: post
        BillingRestore:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/billing/restore
            Method: post
        BillingPortalUrl:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/billing/portal-url
            Method: get

  WebhooksFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/webhooks.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BillingEventsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt BillingProjectionQueue.QueueName
        - !If
          - HasWebhookSecrets
          - Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !If [HasAppleRootCaSecretArn, !Ref AppleRootCaSecretArn, !Ref AWS::NoValue]
                  - !If [HasGoogleServiceAccountSecretArn, !Ref GoogleServiceAccountSecretArn, !Ref AWS::NoValue]
                  - !If [HasPaddleWebhookSecretArn, !Ref PaddleWebhookSecretArn, !Ref AWS::NoValue]
                  - !If [HasTossWebhookSecretArn, !Ref TossWebhookSecretArn, !Ref AWS::NoValue]
          - !Ref AWS::NoValue
      Events:
        AppleWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/webhooks/apple
            Method: post
        GoogleWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/webhooks/google
            Method: post
        PaddleWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/webhooks/paddle
            Method: post
        TossWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/webhooks/toss
            Method: post

  ProjectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/projector.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BillingEventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EntitlementsCurrentTable
        - EventBridgePutEventsPolicy:
            EventBusName: default
      Events:
        ProjectionQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt BillingProjectionQueue.Arn
            BatchSize: 10

  ReconcileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/reconcile.handler
      Timeout: 120
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EntitlementsCurrentTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ReconciliationJobsTable
      Events:
        HourlyReconcile:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Name: !Sub mixroom-subscription-reconcile-${StageName}

  AppApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmTopicArn
    Properties:
      AlarmName: !Sub mixroom-app-api-${StageName}-api-5xx
      AlarmDescription: !Sub Prod app API is returning 5XX responses in ${StageName}.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub mixroom-app-api-${StageName}
        - Name: Stage
          Value: !Ref StageName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopicArn

  AppApiHighLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmTopicArn
    Properties:
      AlarmName: !Sub mixroom-app-api-${StageName}-latency-high
      AlarmDescription: !Sub Prod app API average latency is high in ${StageName}.
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - Name: ApiName
          Value: !Sub mixroom-app-api-${StageName}
        - Name: Stage
          Value: !Ref StageName
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopicArn

