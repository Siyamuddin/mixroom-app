AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Mixroom app API (accounts, profiles, social auth, entitlements, billing)

Parameters:
  StageName:
    Type: String
    Default: staging
  CognitoUserPoolId:
    Type: String
    Default: ''
  CognitoAppClientId:
    Type: String
    Default: ''
  EnforceSubscriptions:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  AllowStudioTier:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  AiUsageStateTableName:
    Type: String
    Default: ''
  AiUsageEventsTableName:
    Type: String
    Default: ''
  AdminCognitoAppClientId:
    Type: String
    Default: ''
  AdminCognitoUserPoolId:
    Type: String
    Default: ''
  AdminAllowedEmails:
    Type: String
    Default: ''
  SocialAuthSecretArn:
    Type: String
    Default: ''
  AppAuthSecretArn:
    Type: String
    Default: ''
  AppAuthIssuer:
    Type: String
    Default: mixroom-native-auth
  AppAuthAudience:
    Type: String
    Default: mixroom-app
  AppAuthEmailFromAddress:
    Type: String
    Default: ''
  AppAuthEmailReplyToAddress:
    Type: String
    Default: ''
  AppAuthAccessTokenTtlSeconds:
    Type: Number
    Default: 3600
  AppAuthRefreshTokenTtlSeconds:
    Type: Number
    Default: 2592000
  GoogleOauthClientIds:
    Type: String
    Default: ''
  SecretCacheTtlSeconds:
    Type: Number
    Default: 300
  HttpTimeoutSeconds:
    Type: Number
    Default: 20
  AppApiMaxRequestBytes:
    Type: Number
    Default: 200000
  ApiThrottleBurstLimit:
    Type: Number
    Default: 1000
  ApiThrottleRateLimit:
    Type: Number
    Default: 500
  WebAclArn:
    Type: String
    Default: ''
  MinimumSignupAgeYears:
    Type: Number
    Default: 13
  AppleBundleId:
    Type: String
    Default: ''
  AppleAppId:
    Type: Number
    Default: 0
  AppleRootCaSecretArn:
    Type: String
    Default: ''
  AppleSharedSecretSecretArn:
    Type: String
    Default: ''
  GooglePlayPackageName:
    Type: String
    Default: ''
  GoogleServiceAccountSecretArn:
    Type: String
    Default: ''
  GooglePubSubAudience:
    Type: String
    Default: ''
  GooglePubSubServiceAccountEmail:
    Type: String
    Default: ''
  PaddleWebhookSecretArn:
    Type: String
    Default: ''
  TossWebhookSecretArn:
    Type: String
    Default: ''
  PostHogApiKey:
    Type: String
    Default: 'phc_t3pSmXe8NYEv8jrpk3dfMnxU6iud4EySnHzAAwFL28g'
  PostHogHost:
    Type: String
    Default: 'https://us.i.posthog.com'
  SentryDsn:
    Type: String
    Default: 'https://5e8e9f0b08714d2c26591bce7b3e057f@o4511009749729280.ingest.us.sentry.io/4511012111712256'
  AlarmTopicArn:
    Type: String
    Default: ''

Conditions:
  HasAiUsageStateTableName: !Not [!Equals [!Ref AiUsageStateTableName, '']]
  HasAiUsageEventsTableName: !Not [!Equals [!Ref AiUsageEventsTableName, '']]
  HasCognitoUserPool: !Not [!Equals [!Ref CognitoUserPoolId, '']]
  HasAdminCognitoAppClientId: !Not [!Equals [!Ref AdminCognitoAppClientId, '']]
  HasAdminCognitoUserPoolId: !Not [!Equals [!Ref AdminCognitoUserPoolId, '']]
  HasSocialAuthSecretArn: !Not [!Equals [!Ref SocialAuthSecretArn, '']]
  HasAppAuthSecretArn: !Not [!Equals [!Ref AppAuthSecretArn, '']]
  HasAppleRootCaSecretArn: !Not [!Equals [!Ref AppleRootCaSecretArn, '']]
  HasAppleSharedSecretSecretArn: !Not [!Equals [!Ref AppleSharedSecretSecretArn, '']]
  HasGoogleServiceAccountSecretArn: !Not [!Equals [!Ref GoogleServiceAccountSecretArn, '']]
  HasPaddleWebhookSecretArn: !Not [!Equals [!Ref PaddleWebhookSecretArn, '']]
  HasTossWebhookSecretArn: !Not [!Equals [!Ref TossWebhookSecretArn, '']]
  HasAlarmTopicArn: !Not [!Equals [!Ref AlarmTopicArn, '']]
  HasBillingSecrets: !Or
    - !Condition HasAppleRootCaSecretArn
    - !Condition HasAppleSharedSecretSecretArn
    - !Condition HasGoogleServiceAccountSecretArn
  HasWebhookSecrets: !Or
    - !Condition HasAppleRootCaSecretArn
    - !Condition HasGoogleServiceAccountSecretArn
    - !Condition HasPaddleWebhookSecretArn
    - !Condition HasTossWebhookSecretArn
  HasWebAclArn: !Not [!Equals [!Ref WebAclArn, '']]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        BILLING_EVENTS_TABLE: !Ref BillingEventsTable
        SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTable
        ENTITLEMENTS_TABLE: !Ref EntitlementsCurrentTable
        USERS_TABLE: !Ref UsersTable
        USERNAME_CLAIMS_TABLE: !Ref UsernameClaimsTable
        AUTH_ACCOUNTS_TABLE: !Ref AuthAccountsTable
        AUTH_SESSIONS_TABLE: !Ref AuthSessionsTable
        AUTH_RATE_LIMITS_TABLE: !Ref AuthRateLimitsTable
        CATALOG_MAPPINGS_TABLE: !Ref CatalogMappingsTable
        CUSTOMER_LINKS_TABLE: !Ref CustomerLinksTable
        PURCHASE_TOKENS_TABLE: !Ref PurchaseTokensTable
        RECONCILIATION_JOBS_TABLE: !Ref ReconciliationJobsTable
        PROJECTION_QUEUE_URL: !Ref BillingProjectionQueue
        USER_TOMBSTONES_TABLE: !Ref UserTombstonesTable
        AI_USAGE_STATE_TABLE: !Ref AiUsageStateTableName
        AI_USAGE_EVENTS_TABLE: !Ref AiUsageEventsTableName
        FEEDBACK_SUBMISSIONS_TABLE: !Ref FeedbackSubmissionsTable
        ADMIN_ALLOWLIST_TABLE: !Ref AdminAllowlistTable
        ADMIN_COGNITO_APP_CLIENT_ID: !If
          - HasAdminCognitoAppClientId
          - !Ref AdminCognitoAppClientId
          - !Ref CognitoAppClientId
        ADMIN_COGNITO_USER_POOL_ID: !If
          - HasAdminCognitoUserPoolId
          - !Ref AdminCognitoUserPoolId
          - !Ref CognitoUserPoolId
        ADMIN_ALLOWED_EMAILS: !Ref AdminAllowedEmails
        SOCIAL_AUTH_SECRET_ARN: !Ref SocialAuthSecretArn
        APP_AUTH_SECRET_ARN: !Ref AppAuthSecretArn
        APP_AUTH_ISSUER: !Ref AppAuthIssuer
        APP_AUTH_AUDIENCE: !Ref AppAuthAudience
        APP_AUTH_EMAIL_FROM_ADDRESS: !Ref AppAuthEmailFromAddress
        APP_AUTH_EMAIL_REPLY_TO_ADDRESS: !Ref AppAuthEmailReplyToAddress
        APP_AUTH_ACCESS_TOKEN_TTL_SECONDS: !Ref AppAuthAccessTokenTtlSeconds
        APP_AUTH_REFRESH_TOKEN_TTL_SECONDS: !Ref AppAuthRefreshTokenTtlSeconds
        GOOGLE_OAUTH_CLIENT_IDS: !Ref GoogleOauthClientIds
        ENFORCE_SUBSCRIPTIONS: !Ref EnforceSubscriptions
        ALLOW_STUDIO_TIER: !Ref AllowStudioTier
        SECRET_CACHE_TTL_SECONDS: !Ref SecretCacheTtlSeconds
        HTTP_TIMEOUT_SECONDS: !Ref HttpTimeoutSeconds
        APP_API_MAX_REQUEST_BYTES: !Ref AppApiMaxRequestBytes
        MINIMUM_SIGNUP_AGE_YEARS: !Ref MinimumSignupAgeYears
        COGNITO_REGION: !Ref AWS::Region
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        COGNITO_APP_CLIENT_ID: !Ref CognitoAppClientId
        APPLE_BUNDLE_ID: !Ref AppleBundleId
        APPLE_APP_ID: !Ref AppleAppId
        APPLE_ROOT_CA_SECRET_ARN: !Ref AppleRootCaSecretArn
        APPLE_SHARED_SECRET_SECRET_ARN: !Ref AppleSharedSecretSecretArn
        GOOGLE_PLAY_PACKAGE_NAME: !Ref GooglePlayPackageName
        GOOGLE_SERVICE_ACCOUNT_SECRET_ARN: !Ref GoogleServiceAccountSecretArn
        GOOGLE_PUBSUB_AUDIENCE: !Ref GooglePubSubAudience
        GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL: !Ref GooglePubSubServiceAccountEmail
        PADDLE_WEBHOOK_SECRET_ARN: !Ref PaddleWebhookSecretArn
        TOSS_WEBHOOK_SECRET_ARN: !Ref TossWebhookSecretArn
        POSTHOG_API_KEY: !Ref PostHogApiKey
        POSTHOG_HOST: !Ref PostHogHost
        SENTRY_DSN: !Ref SentryDsn
        ENVIRONMENT: !Ref StageName

Resources:
  BillingApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub mixroom-app-api-${StageName}
      StageName: !Ref StageName
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          MetricsEnabled: true
          ThrottlingBurstLimit: !Ref ApiThrottleBurstLimit
          ThrottlingRateLimit: !Ref ApiThrottleRateLimit
      Cors:
        AllowMethods: "'GET,POST,PATCH,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Signature'"
        AllowOrigin: "'*'"

  BillingApiWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: HasWebAclArn
    Properties:
      ResourceArn: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/${BillingApi}/stages/${StageName}
      WebACLArn: !Ref WebAclArn

  BillingEventsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub mixroom-billing-events-dlq-${StageName}
      MessageRetentionPeriod: 1209600

  BillingProjectionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub mixroom-billing-projection-${StageName}
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt BillingEventsDlq.Arn
        maxReceiveCount: 6

  BillingEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub mixroom-billing-events-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_id
          AttributeType: S
        - AttributeName: provider_provider_event_id
          AttributeType: S
      KeySchema:
        - AttributeName: event_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: provider_event_idx
          KeySchema:
            - AttributeName: provider_provider_event_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub mixroom-subscriptions-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: subscription_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: updated_at
          AttributeType: S
        - AttributeName: status_key
          AttributeType: S
        - AttributeName: expires_at
          AttributeType: S
      KeySchema:
        - AttributeName: subscription_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user_idx
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: user_updated_idx
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: status_expires_idx
          KeySchema:
            - AttributeName: status_key
              KeyType: HASH
            - AttributeName: expires_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  EntitlementsCurrentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub mixroom-entitlements-current-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: status_key
          AttributeType: S
        - AttributeName: tier_key
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status_idx
          KeySchema:
            - AttributeName: status_key
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: tier_status_idx
          KeySchema:
            - AttributeName: tier_key
              KeyType: HASH
            - AttributeName: status_key
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub mixroom-users-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: email_lc
          AttributeType: S
        - AttributeName: profile_status
          AttributeType: S
        - AttributeName: last_seen_at
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email_idx
          KeySchema:
            - AttributeName: email_lc
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: status_last_seen_idx
          KeySchema:
            - AttributeName: profile_status
              KeyType: HASH
            - AttributeName: last_seen_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  UsernameClaimsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub mixroom-user-username-claims-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: username_lc
          AttributeType: S
      KeySchema:
        - AttributeName: username_lc
          KeyType: HASH

  AuthAccountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub mixroom-auth-accounts-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: email_lc
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email_idx
          KeySchema:
            - AttributeName: email_lc
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  AuthSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub mixroom-auth-sessions-${StageName}
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expires_at_ttl
        Enabled: true
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user_idx
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  AuthRateLimitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub mixroom-auth-rate-limits-${StageName}
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expires_at_ttl
        Enabled: true
      AttributeDefinitions:
        - AttributeName: scope_key
          AttributeType: S
      KeySchema:
        - AttributeName: scope_key
          KeyType: HASH

  CatalogMappingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub mixroom-catalog-mappings-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: provider_product_key
          AttributeType: S
      KeySchema:
        - AttributeName: provider_product_key
          KeyType: HASH

  CustomerLinksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub mixroom-customer-links-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: provider_customer_key
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: provider_customer_key
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user_idx
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  PurchaseTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub mixroom-purchase-tokens-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: provider_token_hash
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: provider_token_hash
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user_idx
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ReconciliationJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub mixroom-reconciliation-jobs-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH

  AdminAllowlistTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub mixroom-admin-allowlist-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  UserTombstonesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub mixroom-user-tombstones-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: deleted_at
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: deleted_at
          KeyType: RANGE

  FeedbackSubmissionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub mixroom-feedback-submissions-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: submission_id
          AttributeType: S
        - AttributeName: bucket
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: submission_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: created_at_idx
          KeySchema:
            - AttributeName: bucket
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  EntitlementApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/api_entitlements.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EntitlementsCurrentTable
        - DynamoDBReadPolicy:
            TableName: !Ref AuthAccountsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthSessionsTable
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref AppAuthSecretArn
      Events:
        EntitlementsMe:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/entitlements/me
            Method: get

  UsersApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/api_users.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsernameClaimsTable
        - DynamoDBReadPolicy:
            TableName: !Ref AuthAccountsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthSessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthRateLimitsTable
        - !If
          - HasAppAuthSecretArn
          - Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref AppAuthSecretArn
          - !Ref AWS::NoValue
      Events:
        UsernameAvailability:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/users/username-availability
            Method: get
        UsersMe:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/users/me
            Method: ANY

  FeedbackApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/api_feedback.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FeedbackSubmissionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref AuthAccountsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthSessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthRateLimitsTable
        - !If
          - HasAppAuthSecretArn
          - Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref AppAuthSecretArn
          - !Ref AWS::NoValue
      Events:
        FeedbackSubmit:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/feedback
            Method: post

  SocialAuthApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/api_auth.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsernameClaimsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EntitlementsCurrentTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthAccountsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthSessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthRateLimitsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CustomerLinksTable
        - !If
          - HasSocialAuthSecretArn
          - Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref SocialAuthSecretArn
          - !Ref AWS::NoValue
        - !If
          - HasAppAuthSecretArn
          - Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref AppAuthSecretArn
          - !Ref AWS::NoValue
        - !If
          - HasCognitoUserPool
          - Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:InitiateAuth
                  - cognito-idp:ConfirmSignUp
                  - cognito-idp:ResendConfirmationCode
                  - cognito-idp:ForgotPassword
                  - cognito-idp:ConfirmForgotPassword
                  - cognito-idp:ListUsers
                Resource: '*'
          - !Ref AWS::NoValue
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
                - ses:SendTemplatedEmail
                - ses:SendBulkTemplatedEmail
                - ses:SendBulkEmail
              Resource: '*'
      Events:
        EmailSignUp:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/auth/sign-up
            Method: post
        EmailConfirmSignUp:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/auth/confirm-sign-up
            Method: post
        ResendSignUpCode:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/auth/resend-sign-up-code
            Method: post
        PasswordSignIn:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/auth/sign-in
            Method: post
        PasswordResetRequest:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/auth/password-reset/request
            Method: post
        PasswordResetConfirm:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/auth/password-reset/confirm
            Method: post
        ChangePassword:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/auth/change-password
            Method: post
        ResendEmailVerification:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/auth/resend-email-verification
            Method: post
        RefreshSession:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/auth/refresh
            Method: post
        SignOut:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/auth/sign-out
            Method: post
        SocialSignIn:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/auth/social/sign-in
            Method: post

  AdminOverviewApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/api_admin_overview.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref EntitlementsCurrentTable
        - DynamoDBReadPolicy:
            TableName: !Ref AdminAllowlistTable
        - !If
          - HasAiUsageStateTableName
          - DynamoDBReadPolicy:
              TableName: !Ref AiUsageStateTableName
          - !Ref AWS::NoValue
        - !If
          - HasAiUsageEventsTableName
          - DynamoDBReadPolicy:
              TableName: !Ref AiUsageEventsTableName
          - !Ref AWS::NoValue
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:DescribeTable
              Resource: !GetAtt UsersTable.Arn
      Events:
        AdminOverview:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/internal/admin/overview
            Method: get

  AdminUsersApiFunction:
