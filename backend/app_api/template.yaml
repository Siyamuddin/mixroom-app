  NativeAuthDynamoDbThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmTopicArn
    Properties:
      AlarmName: !Sub mixroom-app-api-${StageName}-native-auth-throttles
      AlarmDescription: !Sub Native auth DynamoDB tables are throttling in ${StageName}.
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopicArn
      Metrics:
        - Id: authAccountsRead
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: ReadThrottleEvents
              Dimensions:
                - Name: TableName
                  Value: !Ref AuthAccountsTable
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: authAccountsWrite
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: WriteThrottleEvents
              Dimensions:
                - Name: TableName
                  Value: !Ref AuthAccountsTable
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: authSessionsRead
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: ReadThrottleEvents
              Dimensions:
                - Name: TableName
                  Value: !Ref AuthSessionsTable
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: authSessionsWrite
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: WriteThrottleEvents
              Dimensions:
                - Name: TableName
                  Value: !Ref AuthSessionsTable
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: totalThrottles
          Expression: authAccountsRead + authAccountsWrite + authSessionsRead + authSessionsWrite
          Label: native-auth-throttles
          ReturnData: true

