          - HasGoogleServiceAccountSecretArn
          - Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref GoogleServiceAccountSecretArn
          - !Ref AWS::NoValue
