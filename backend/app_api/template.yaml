    Type: String
    Default: prod
  CognitoUserPoolId:
    Type: String
    Default: ''
  CognitoAppClientId:
    Type: String
    Default: ''
  AiUsageStateTableName:
    Type: String
    Default: ''
  AiUsageEventsTableName:
    Type: String
    Default: ''
  AiPromptLimitSettingsTableName:
    Type: String
    Default: ''
  AdminCognitoAppClientId:
    Type: String
    Default: ''
  AdminCognitoUserPoolId:
    Type: String
    Default: ''
  AiAdminEditorEmails:
    Type: String
    Default: 'andrew@mixroom.ai'
  AiRuntimeDefaultModel:
    Type: String
    Default: 'gpt-4.1-mini'
  AiChatDefaultTemperature:
    Type: String
    Default: '0.35'
  VideoEditorDefaultTemperature:
    Type: String
    Default: '0.1'
  AiChatExtendedPromptCacheRetentionModels:
    Type: String
