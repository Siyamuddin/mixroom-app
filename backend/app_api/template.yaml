          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Name: !Sub mixroom-subscription-reconcile-${StageName}

  AppApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmTopicArn
    Properties:
      AlarmName: !Sub mixroom-app-api-${StageName}-api-5xx
      AlarmDescription: !Sub Prod app API is returning 5XX responses in ${StageName}.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub mixroom-app-api-${StageName}
        - Name: Stage
          Value: !Ref StageName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopicArn

