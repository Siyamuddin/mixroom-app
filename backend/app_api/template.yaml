            TableName: !Ref AdminAllowlistTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsernameClaimsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthAccountsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthSessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EntitlementsCurrentTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CustomerLinksTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PurchaseTokensTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserTombstonesTable
