    Type: String
    Default: ''
  AppAuthSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
  AppAuthSecretParameterName:
    Type: String
    Default: ''
  AppAuthIssuer:
    Type: String
    Default: mixroom-native-auth
  AppAuthAudience:
    Type: String
    Default: mixroom-app
  AppAuthEmailFromAddress:
    Type: String
    Default: ''
  AppAuthEmailReplyToAddress:
    Type: String
    Default: ''
  PostmarkServerToken:
    Type: String
    NoEcho: true
    Default: ''
  PostmarkServerTokenSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
  PostmarkServerTokenParameterName:
    Type: String
    Default: ''
  PostmarkApiBaseUrl:
    Type: String
    Default: 'https://api.postmarkapp.com'
  PostmarkMessageStream:
    Type: String
    Default: ''
  StibeeAccessToken:
    Type: String
    NoEcho: true
    Default: ''
  StibeeAccessTokenSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
  StibeeAccessTokenParameterName:
    Type: String
    Default: ''
  StibeeApiBaseUrl:
    Type: String
    Default: 'https://api.stibee.com/v2'
  StibeeAppSignupsListId:
    Type: String
    Default: ''
  StibeeNewsletterListId:
    Type: String
    Default: ''
  StibeeLanguageFieldKey:
    Type: String
    Default: 'language'
  StibeeNameFieldKey:
    Type: String
    Default: ''
  StibeeSourceFieldKey:
    Type: String
    Default: ''
  StibeeDateFieldKey:
    Type: String
    Default: ''
  StibeeUserIdFieldKey:
    Type: String
    Default: ''
  StibeeSubscriptionStatusFieldKey:
    Type: String
    Default: ''
  StibeeWebhookSharedSecret:
    Type: String
    NoEcho: true
    Default: ''
  StibeeWebhookSharedSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
  StibeeWebhookSharedSecretParameterName:
    Type: String
    Default: ''
  StibeeWebhookAllowedIps:
    Type: String
    Default: '52.78.132.66'
  AppAuthAccessTokenTtlSeconds:
    Type: Number
    Default: 3600
  AppAuthRefreshTokenTtlSeconds:
    Type: Number
    Default: 2592000
  GoogleOauthClientIds:
    Type: String
    Default: ''
  SecretCacheTtlSeconds:
    Type: Number
    Default: 300
  HttpTimeoutSeconds:
    Type: Number
    Default: 20
  AppApiMaxRequestBytes:
    Type: Number
    Default: 200000
  ApiThrottleBurstLimit:
    Type: Number
    Default: 1000
  ApiThrottleRateLimit:
    Type: Number
    Default: 500
  ApiDetailedMetricsEnabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  WebAclArn:
    Type: String
    Default: ''
  MinimumSignupAgeYears:
    Type: Number
    Default: 13
  AppleBundleId:
    Type: String
    Default: ''
  AppleAppId:
    Type: Number
    Default: 0
  AppleRootCaSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
  AppleRootCaParameterName:
    Type: String
    Default: ''
  AppleSharedSecretSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
  AppleSharedSecretParameterName:
    Type: String
    Default: ''
  GooglePlayPackageName:
    Type: String
    Default: ''
  GoogleServiceAccountSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
  GoogleServiceAccountParameterName:
    Type: String
    Default: ''
  GooglePubSubAudience:
    Type: String
    Default: ''
  GooglePubSubServiceAccountEmail:
    Type: String
    Default: ''
  PaddleWebhookSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
  PaddleWebhookSecretParameterName:
    Type: String
    Default: ''
  TossWebhookSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
  TossWebhookSecretParameterName:
    Type: String
    Default: ''
  PaddleApiKeySecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
  PaddleApiKeyParameterName:
    Type: String
    Default: ''
  PaddleApiBaseUrl:
    Type: String
    Default: 'https://api.paddle.com'
  TossSecretKeySecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
  TossSecretKeyParameterName:
    Type: String
    Default: ''
  TossApiBaseUrl:
    Type: String
    Default: 'https://api.tosspayments.com'
  PostHogApiKey:
    Type: String
    Default: 'phc_t3pSmXe8NYEv8jrpk3dfMnxU6iud4EySnHzAAwFL28g'
  PostHogHost:
    Type: String
    Default: 'https://us.i.posthog.com'
  PostHogAppHost:
    Type: String
    Default: 'https://us.posthog.com'
  PostHogProjectId:
    Type: String
    Default: ''
  PostHogPersonalApiKey:
    Type: String
    NoEcho: true
    Default: ''
  PostHogPersonalApiKeySecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
  PostHogPersonalApiKeyParameterName:
    Type: String
    Default: ''
  PostHogMetricsCacheTtlSeconds:
    Type: Number
    Default: 300
  SentryDsn:
    Type: String
    Default: 'https://5e8e9f0b08714d2c26591bce7b3e057f@o4511009749729280.ingest.us.sentry.io/4511012111712256'
  AlarmTopicArn:
    Type: String
    Default: ''
  BillingSuccessTopicArn:
    Type: String
    Default: ''
  CloudProjectStorageProvider:
    Type: String
    AllowedValues: ['s3', 'r2']
    Default: 's3'
  CloudProjectR2BucketName:
    Type: String
    Default: ''
  CloudProjectR2AccountId:
    Type: String
    Default: ''
  CloudProjectR2EndpointUrl:
    Type: String
    Default: ''
  CloudProjectR2AccessKeyId:
    Type: String
    Default: ''
  CloudProjectR2SecretAccessKeySecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
  CloudProjectR2SecretAccessKeyParameterName:
    Type: String
    Default: ''

Conditions:
  ApiDetailedMetricsEnabledCondition: !Equals [!Ref ApiDetailedMetricsEnabled, 'true']
  HasAiUsageStateTableName: !Not [!Equals [!Ref AiUsageStateTableName, '']]
  HasAiUsageEventsTableName: !Not [!Equals [!Ref AiUsageEventsTableName, '']]
  HasAiPromptLimitSettingsTableName: !Not [!Equals [!Ref AiPromptLimitSettingsTableName, '']]
  HasCognitoUserPool: !Not [!Equals [!Ref CognitoUserPoolId, '']]
  HasAdminCognitoAppClientId: !Not [!Equals [!Ref AdminCognitoAppClientId, '']]
  HasAdminCognitoUserPoolId: !Not [!Equals [!Ref AdminCognitoUserPoolId, '']]
  HasSocialAuthSecretArn: !Not [!Equals [!Ref SocialAuthSecretArn, '']]
  HasAppAuthSecretArn: !Not [!Equals [!Ref AppAuthSecretArn, '']]
  HasPostmarkServerTokenSecretArn: !Not [!Equals [!Ref PostmarkServerTokenSecretArn, '']]
  HasStibeeAccessTokenSecretArn: !Not [!Equals [!Ref StibeeAccessTokenSecretArn, '']]
  HasStibeeWebhookSharedSecretArn: !Not [!Equals [!Ref StibeeWebhookSharedSecretArn, '']]
  HasAppleRootCaSecretArn: !Not [!Equals [!Ref AppleRootCaSecretArn, '']]
  HasAppleSharedSecretSecretArn: !Not [!Equals [!Ref AppleSharedSecretSecretArn, '']]
  HasGoogleServiceAccountSecretArn: !Not [!Equals [!Ref GoogleServiceAccountSecretArn, '']]
  HasPaddleWebhookSecretArn: !Not [!Equals [!Ref PaddleWebhookSecretArn, '']]
  HasPaddleApiKeySecretArn: !Not [!Equals [!Ref PaddleApiKeySecretArn, '']]
  HasTossSecretKeySecretArn: !Not [!Equals [!Ref TossSecretKeySecretArn, '']]
  HasAlarmTopicArn: !Not [!Equals [!Ref AlarmTopicArn, '']]
  HasBillingSuccessTopicArn: !Not [!Equals [!Ref BillingSuccessTopicArn, '']]
  HasPostHogPersonalApiKeySecretArn: !Not [!Equals [!Ref PostHogPersonalApiKeySecretArn, '']]
  IsCloudProjectR2Storage: !Equals [!Ref CloudProjectStorageProvider, 'r2']
  HasCloudProjectR2SecretAccessKeySecretArn: !Not [!Equals [!Ref CloudProjectR2SecretAccessKeySecretArn, '']]
  HasBillingSecrets: !Or
    - !Condition HasAppleRootCaSecretArn
    - !Condition HasAppleSharedSecretSecretArn
    - !Condition HasGoogleServiceAccountSecretArn
    - !Condition HasPaddleApiKeySecretArn
    - !Condition HasTossSecretKeySecretArn
  HasWebhookSecrets: !Or
    - !Condition HasAppleRootCaSecretArn
    - !Condition HasGoogleServiceAccountSecretArn
    - !Condition HasPaddleWebhookSecretArn
    - !Condition HasTossSecretKeySecretArn
  HasWebAclArn: !Not [!Equals [!Ref WebAclArn, '']]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        BILLING_EVENTS_TABLE: !Ref BillingEventsTable
        SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTable
        ENTITLEMENTS_TABLE: !Ref EntitlementsCurrentTable
        USERS_TABLE: !Ref UsersTable
        USERNAME_CLAIMS_TABLE: !Ref UsernameClaimsTable
        AUTH_ACCOUNTS_TABLE: !Ref AuthAccountsTable
        AUTH_SESSIONS_TABLE: !Ref AuthSessionsTable
        AUTH_RATE_LIMITS_TABLE: !Ref AuthRateLimitsTable
        CATALOG_MAPPINGS_TABLE: !Ref CatalogMappingsTable
        FEATURE_FLAGS_TABLE: !Ref FeatureFlagsTable
        COLLABORATION_TABLE: !Ref CollaborationTable
        CUSTOMER_LINKS_TABLE: !Ref CustomerLinksTable
        PURCHASE_TOKENS_TABLE: !Ref PurchaseTokensTable
        RECONCILIATION_JOBS_TABLE: !Ref ReconciliationJobsTable
        PROJECTION_QUEUE_URL: !Ref BillingProjectionQueue
        USER_TOMBSTONES_TABLE: !Ref UserTombstonesTable
        ADMIN_ENTITLEMENT_OVERRIDES_TABLE: !Ref AdminEntitlementOverridesTable
        SOCIAL_AUTH_SECRET_PARAMETER_NAME: !Ref SocialAuthSecretParameterName
        SOCIAL_AUTH_SECRET_ARN: !Ref SocialAuthSecretArn
        APP_AUTH_SECRET_PARAMETER_NAME: !Ref AppAuthSecretParameterName
        APP_AUTH_SECRET_ARN: !Ref AppAuthSecretArn
        APP_AUTH_ISSUER: !Ref AppAuthIssuer
        APP_AUTH_AUDIENCE: !Ref AppAuthAudience
        APP_AUTH_EMAIL_FROM_ADDRESS: !Ref AppAuthEmailFromAddress
        APP_AUTH_EMAIL_REPLY_TO_ADDRESS: !Ref AppAuthEmailReplyToAddress
        POSTMARK_SERVER_TOKEN_PARAMETER_NAME: !Ref PostmarkServerTokenParameterName
        POSTMARK_SERVER_TOKEN_SECRET_ARN: !Ref PostmarkServerTokenSecretArn
        POSTMARK_API_BASE_URL: !Ref PostmarkApiBaseUrl
        POSTMARK_MESSAGE_STREAM: !Ref PostmarkMessageStream
        APP_AUTH_ACCESS_TOKEN_TTL_SECONDS: !Ref AppAuthAccessTokenTtlSeconds
        APP_AUTH_REFRESH_TOKEN_TTL_SECONDS: !Ref AppAuthRefreshTokenTtlSeconds
        SECRET_CACHE_TTL_SECONDS: !Ref SecretCacheTtlSeconds
        HTTP_TIMEOUT_SECONDS: !Ref HttpTimeoutSeconds
        APP_API_MAX_REQUEST_BYTES: !Ref AppApiMaxRequestBytes
        MINIMUM_SIGNUP_AGE_YEARS: !Ref MinimumSignupAgeYears
        COGNITO_REGION: !Ref AWS::Region
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        COGNITO_APP_CLIENT_ID: !Ref CognitoAppClientId
        APPLE_BUNDLE_ID: !Ref AppleBundleId
        APPLE_APP_ID: !Ref AppleAppId
        APPLE_ROOT_CA_PARAMETER_NAME: !Ref AppleRootCaParameterName
        APPLE_ROOT_CA_SECRET_ARN: !Ref AppleRootCaSecretArn
        APPLE_SHARED_SECRET_PARAMETER_NAME: !Ref AppleSharedSecretParameterName
        APPLE_SHARED_SECRET_SECRET_ARN: !Ref AppleSharedSecretSecretArn
        GOOGLE_PLAY_PACKAGE_NAME: !Ref GooglePlayPackageName
        GOOGLE_SERVICE_ACCOUNT_PARAMETER_NAME: !Ref GoogleServiceAccountParameterName
        GOOGLE_SERVICE_ACCOUNT_SECRET_ARN: !Ref GoogleServiceAccountSecretArn
        GOOGLE_PUBSUB_AUDIENCE: !Ref GooglePubSubAudience
        GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL: !Ref GooglePubSubServiceAccountEmail
        PADDLE_WEBHOOK_SECRET_PARAMETER_NAME: !Ref PaddleWebhookSecretParameterName
        PADDLE_WEBHOOK_SECRET_ARN: !Ref PaddleWebhookSecretArn
        TOSS_WEBHOOK_SECRET_PARAMETER_NAME: !Ref TossWebhookSecretParameterName
        TOSS_WEBHOOK_SECRET_ARN: !Ref TossWebhookSecretArn
        TOSS_BILLING_KEY_PARAMETER_PREFIX: !Sub /mixroom/payment-credentials/${StageName}/toss
        PAYMENT_CREDENTIAL_SECRET_PREFIX: !Sub mixroom/payment-credentials/${StageName}
        POSTHOG_API_KEY: !Ref PostHogApiKey
        POSTHOG_HOST: !Ref PostHogHost
        SENTRY_DSN: !Ref SentryDsn
        ENVIRONMENT: !Ref StageName
        CLOUD_PROJECT_DOCUMENTS_BUCKET: !If
          - IsCloudProjectR2Storage
          - !Ref CloudProjectR2BucketName
          - !Ref CloudProjectDocumentsBucket
        CLOUD_PROJECT_STORAGE_PROVIDER: !Ref CloudProjectStorageProvider
        CLOUD_PROJECT_R2_ACCOUNT_ID: !Ref CloudProjectR2AccountId
        CLOUD_PROJECT_R2_ENDPOINT_URL: !Ref CloudProjectR2EndpointUrl
        CLOUD_PROJECT_R2_ACCESS_KEY_ID: !Ref CloudProjectR2AccessKeyId
        CLOUD_PROJECT_R2_SECRET_ACCESS_KEY_PARAMETER_NAME: !Ref CloudProjectR2SecretAccessKeyParameterName
        CLOUD_PROJECT_R2_SECRET_ACCESS_KEY_SECRET_ARN: !Ref CloudProjectR2SecretAccessKeySecretArn

Resources:
  BillingApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub mixroom-app-api-${StageName}
      StageName: !Ref StageName
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          MetricsEnabled: !If [ApiDetailedMetricsEnabledCondition, true, false]
          ThrottlingBurstLimit: !Ref ApiThrottleBurstLimit
          ThrottlingRateLimit: !Ref ApiThrottleRateLimit
      Cors:
        AllowMethods: "'GET,POST,PATCH,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Signature'"
        AllowOrigin: "'*'"

  BillingApiWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: HasWebAclArn
    Properties:
      ResourceArn: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/${BillingApi}/stages/${StageName}
      WebACLArn: !Ref WebAclArn

  BillingEventsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub mixroom-billing-events-dlq-${StageName}
      MessageRetentionPeriod: 1209600

  BillingProjectionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub mixroom-billing-projection-${StageName}
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt BillingEventsDlq.Arn
        maxReceiveCount: 6

  BillingEventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub mixroom-billing-events-${StageName}
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: event_id
          AttributeType: S
        - AttributeName: provider_provider_event_id
          AttributeType: S
      KeySchema:
        - AttributeName: event_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: provider_event_idx
          KeySchema:
            - AttributeName: provider_provider_event_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub mixroom-subscriptions-${StageName}
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: subscription_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: updated_at
          AttributeType: S
        - AttributeName: status_key
          AttributeType: S
        - AttributeName: expires_at
          AttributeType: S
      KeySchema:
        - AttributeName: subscription_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user_idx
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: user_updated_idx
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: status_expires_idx
          KeySchema:
            - AttributeName: status_key
              KeyType: HASH
            - AttributeName: expires_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  EntitlementsCurrentTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub mixroom-entitlements-current-${StageName}
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: status_key
          AttributeType: S
        - AttributeName: tier_key
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status_idx
          KeySchema:
            - AttributeName: status_key
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: tier_status_idx
          KeySchema:
            - AttributeName: tier_key
              KeyType: HASH
            - AttributeName: status_key
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub mixroom-users-${StageName}
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: email_lc
          AttributeType: S
        - AttributeName: profile_status
          AttributeType: S
        - AttributeName: last_seen_at
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email_idx
          KeySchema:
            - AttributeName: email_lc
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: status_last_seen_idx
          KeySchema:
            - AttributeName: profile_status
              KeyType: HASH
            - AttributeName: last_seen_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  UsernameClaimsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub mixroom-user-username-claims-${StageName}
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: username_lc
          AttributeType: S
      KeySchema:
        - AttributeName: username_lc
          KeyType: HASH

  AuthAccountsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub mixroom-auth-accounts-${StageName}
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: email_lc
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email_idx
          KeySchema:
            - AttributeName: email_lc
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  AuthSessionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub mixroom-auth-sessions-${StageName}
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expires_at_ttl
        Enabled: true
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user_idx
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  AuthRateLimitsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub mixroom-auth-rate-limits-${StageName}
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expires_at_ttl
        Enabled: true
      AttributeDefinitions:
        - AttributeName: scope_key
          AttributeType: S
      KeySchema:
        - AttributeName: scope_key
          KeyType: HASH

  CatalogMappingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub mixroom-catalog-mappings-${StageName}
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: provider_product_key
          AttributeType: S
      KeySchema:
        - AttributeName: provider_product_key
          KeyType: HASH

  FeatureFlagsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub mixroom-feature-flags-${StageName}
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: flag_set_key
          AttributeType: S
      KeySchema:
