    Description: App Store Server Notifications endpoint
    Value: !Sub https://${BillingApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/v1/webhooks/apple
  GoogleWebhookUrl:
    Description: Google RTDN webhook endpoint
    Value: !Sub https://${BillingApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/v1/webhooks/google
  ProjectionQueueUrl:
    Value: !Ref BillingProjectionQueue
  BillingEventsTableName:
    Value: !Ref BillingEventsTable
  AuthRateLimitsTableName:
    Value: !Ref AuthRateLimitsTable
  SubscriptionsTableName:
    Value: !Ref SubscriptionsTable
  EntitlementsCurrentTableName:
    Value: !Ref EntitlementsCurrentTable
  UsersTableName:
    Value: !Ref UsersTable
  UsernameClaimsTableName:
    Value: !Ref UsernameClaimsTable
  AuthAccountsTableName:
    Value: !Ref AuthAccountsTable
  AuthSessionsTableName:
    Value: !Ref AuthSessionsTable
  CatalogMappingsTableName:
    Value: !Ref CatalogMappingsTable
  CustomerLinksTableName:
    Value: !Ref CustomerLinksTable
  PurchaseTokensTableName:
