          - HasAiUsageStateTableName
          - DynamoDBCrudPolicy:
              TableName: !Ref AiUsageStateTableName
          - !Ref AWS::NoValue
        - !If
          - HasCognitoUserPool
          - Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminDeleteUser
                Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
          - !Ref AWS::NoValue
      Events:
        AdminUsersSearch:
          Type: Api
          Properties:
