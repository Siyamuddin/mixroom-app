AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Mixroom authenticated LLM proxy for beta chat

Parameters:
  StageName:
    Type: String
    Default: prod
  AppAuthSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
  AppAuthSecretParameterName:
    Type: String
    Default: ''
  AppAuthIssuer:
    Type: String
    Default: mixroom-native-auth
  AppAuthAudience:
    Type: String
    Default: mixroom-app
  AuthAccountsTableName:
    Type: String
  AuthSessionsTableName:
    Type: String
  LlmProvider:
    Type: String
    Default: openai
    AllowedValues:
      - openai
      - claude
      - gemini
  OpenAiApiKeySecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
  OpenAiApiKeyParameterName:
    Type: String
    Default: ''
  OpenAiModel:
    Type: String
    Default: gpt-5.4-mini
  AiV3Model:
    Type: String
    Default: gpt-5.6-luna
  AiV3ReasoningEffort:
    Type: String
    Default: low
    AllowedValues:
      - none
      - minimal
      - low
      - medium
      - high
      - xhigh
  AiV3Enabled:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
  AiV3ServerContractEnabled:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
  AiV3ServerContractV1Enabled:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
  AiV3ServerContractV2Enabled:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
  AiV3LegacyClientContractEnabled:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
  AiChatDefaultTemperature:
    Type: String
    Default: '0.35'
  VideoEditorDefaultTemperature:
    Type: String
    Default: '0.1'
  AiChatExtendedPromptCacheRetentionModels:
    Type: String
    Default: 'gpt-4.1,gpt-5,gpt-5-codex,gpt-5.1,gpt-5.1-codex,gpt-5.1-codex-mini,gpt-5.1-chat-latest,gpt-5.2,gpt-5.4-mini'
  AllowClientModelOverride:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
  OpenAiSecretCacheTtlSeconds:
    Type: Number
    Default: 300
  EntitlementsTableName:
    Type: String
  CollaborationTableName:
    Type: String
    Default: ''
  MaxRequestBytes:
    Type: Number
    Default: 200000
  LlmMaxOutputTokens:
    Type: Number
    Default: 8192
  MixApplyModelPath:
    Type: String
    Default: ''
  MixMagnitudeModelPath:
    Type: String
    Default: ''
  MixModelManifestUrl:
    Type: String
    Default: ''
  MixModelManifestTimeoutSeconds:
    Type: Number
    Default: 4
  MixModelDownloadTimeoutSeconds:
    Type: Number
    Default: 12
  MixModelCacheDirectory:
    Type: String
    Default: /tmp/mixroom_mix_models
  MixModelBundleVersion:
    Type: String
    Default: server-default
  MixResolveMaxActions:
    Type: Number
    Default: 64
  ApiThrottleBurstLimit:
    Type: Number
    Default: 200
  ApiThrottleRateLimit:
    Type: Number
    Default: 100
  V3LongApiThrottleBurstLimit:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 20
  V3LongApiThrottleRateLimit:
    Type: Number
    Default: 1
    MinValue: 0.1
    MaxValue: 1
  ApiDetailedMetricsEnabled:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
  WebAclArn:
    Type: String
    Default: ''
  PostHogApiKey:
    Type: String
    Default: phc_t3pSmXe8NYEv8jrpk3dfMnxU6iud4EySnHzAAwFL28g
  PostHogHost:
    Type: String
    Default: https://us.i.posthog.com
  SentryDsn:
    Type: String
    Default: https://5e8e9f0b08714d2c26591bce7b3e057f@o4511009749729280.ingest.us.sentry.io/4511012111712256
  AlarmTopicArn:
    Type: String
    Default: ''

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        LLM_PROVIDER: !Ref LlmProvider
        LLM_API_KEY_PARAMETER_NAME: !Ref OpenAiApiKeyParameterName
        LLM_API_KEY_SECRET_ARN: !Ref OpenAiApiKeySecretArn
        LLM_MODEL: !Ref OpenAiModel
        LLM_SECRET_CACHE_TTL_SECONDS: !Ref OpenAiSecretCacheTtlSeconds
        LLM_TIMEOUT_SECONDS: 30
        ANTHROPIC_VERSION: 2023-06-01
        OPENAI_API_KEY_PARAMETER_NAME: !Ref OpenAiApiKeyParameterName
        OPENAI_API_KEY_SECRET_ARN: !Ref OpenAiApiKeySecretArn
        OPENAI_MODEL: !Ref OpenAiModel
        AI_RUNTIME_DEFAULT_MODEL: !Ref OpenAiModel
        AI_V3_MODEL: !Ref AiV3Model
        AI_V3_REASONING_EFFORT: !Ref AiV3ReasoningEffort
        AI_V3_ENABLED: !Ref AiV3Enabled
        AI_V3_SERVER_CONTRACT_ENABLED: !Ref AiV3ServerContractEnabled
        AI_V3_SERVER_CONTRACT_V1_ENABLED: !Ref AiV3ServerContractV1Enabled
        AI_V3_SERVER_CONTRACT_V2_ENABLED: !Ref AiV3ServerContractV2Enabled
        AI_V3_LEGACY_CLIENT_CONTRACT_ENABLED: !Ref AiV3LegacyClientContractEnabled
        AI_CHAT_DEFAULT_TEMPERATURE: !Ref AiChatDefaultTemperature
        VIDEO_EDITOR_DEFAULT_TEMPERATURE: !Ref VideoEditorDefaultTemperature
        AI_CHAT_EXTENDED_PROMPT_CACHE_RETENTION_MODELS: !Ref AiChatExtendedPromptCacheRetentionModels
        ALLOW_CLIENT_MODEL_OVERRIDE: !Ref AllowClientModelOverride
        OPENAI_SECRET_CACHE_TTL_SECONDS: !Ref OpenAiSecretCacheTtlSeconds
        MAX_REQUEST_BYTES: !Ref MaxRequestBytes
        OPENAI_TIMEOUT_SECONDS: 30
        POSTHOG_API_KEY: !Ref PostHogApiKey
        POSTHOG_HOST: !Ref PostHogHost
        SENTRY_DSN: !Ref SentryDsn
        ENVIRONMENT: !Ref StageName
        APP_AUTH_SECRET_PARAMETER_NAME: !Ref AppAuthSecretParameterName
        APP_AUTH_SECRET_ARN: !Ref AppAuthSecretArn
        APP_AUTH_ISSUER: !Ref AppAuthIssuer
        APP_AUTH_AUDIENCE: !Ref AppAuthAudience
        AUTH_ACCOUNTS_TABLE: !Ref AuthAccountsTableName
        AUTH_SESSIONS_TABLE: !Ref AuthSessionsTableName
        AI_USAGE_STATE_TABLE: !Ref AiUsageMetricsTable
        AI_USAGE_METRICS_TABLE: !Ref AiUsageMetricsTable
        AI_USAGE_EVENTS_TABLE: !Ref AiUsageEventsTable
        AI_PROMPT_LIMIT_SETTINGS_TABLE: !Ref AiPromptLimitSettingsTable
        OPENAI_CONVERSATION_STATE_TABLE: !Ref OpenAiConversationStateTable
        ENTITLEMENTS_TABLE: !Ref EntitlementsTableName
        COLLABORATION_TABLE: !Ref CollaborationTableName
        LLM_MAX_OUTPUT_TOKENS: !Ref LlmMaxOutputTokens
        MIX_APPLY_MODEL_PATH: !Ref MixApplyModelPath
        MIX_MAGNITUDE_MODEL_PATH: !Ref MixMagnitudeModelPath
        MIX_MODEL_MANIFEST_URL: !Ref MixModelManifestUrl
        MIX_MODEL_MANIFEST_TIMEOUT_SECONDS: !Ref MixModelManifestTimeoutSeconds
        MIX_MODEL_DOWNLOAD_TIMEOUT_SECONDS: !Ref MixModelDownloadTimeoutSeconds
        MIX_MODEL_CACHE_DIRECTORY: !Ref MixModelCacheDirectory
        MIX_MODEL_BUNDLE_VERSION: !Ref MixModelBundleVersion
        MIX_RESOLVE_MAX_ACTIONS: !Ref MixResolveMaxActions

Conditions:
  ApiDetailedMetricsEnabledCondition: !Equals [!Ref ApiDetailedMetricsEnabled, 'true']
  HasAppAuthSecretArn: !Not [!Equals [!Ref AppAuthSecretArn, '']]
  HasOpenAiApiKeySecretArn: !Not [!Equals [!Ref OpenAiApiKeySecretArn, '']]
  HasCollaborationTableName: !Not [!Equals [!Ref CollaborationTableName, '']]
  HasAlarmTopicArn: !Not
    - !Equals
      - !Ref AlarmTopicArn
      - ''

Resources:
  AiUsageMetricsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub mixroom-ai-usage-metrics-${StageName}
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

  AiUsageEventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub mixroom-ai-usage-events-${StageName}
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
        - AttributeName: feature
          AttributeType: S
        - AttributeName: record_type
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user_created_at_idx
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: feature_created_at_idx
          KeySchema:
            - AttributeName: feature
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: created_at_idx
          KeySchema:
            - AttributeName: record_type
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  AiPromptLimitSettingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub mixroom-ai-prompt-limit-settings-${StageName}
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: setting_key
          AttributeType: S
      KeySchema:
        - AttributeName: setting_key
          KeyType: HASH

  OpenAiConversationStateTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub mixroom-openai-conversation-state-${StageName}
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: mapping_key
          AttributeType: S
        - AttributeName: session_key
          AttributeType: S
        - AttributeName: updated_at
          AttributeType: S
      KeySchema:
        - AttributeName: mapping_key
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: session_updated_at_idx
          KeySchema:
            - AttributeName: session_key
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  LlmApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      DefaultRouteSettings:
        DetailedMetricsEnabled: !If [ApiDetailedMetricsEnabledCondition, true, false]
        ThrottlingBurstLimit: !Ref ApiThrottleBurstLimit
        ThrottlingRateLimit: !Ref ApiThrottleRateLimit
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  ProxyResponsesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/api_responses.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mixroom/*
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
                  kms:CallerAccount: !Ref AWS::AccountId
        - !If
          - HasOpenAiApiKeySecretArn
          - Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref OpenAiApiKeySecretArn
          - !Ref AWS::NoValue
        - !If
          - HasAppAuthSecretArn
          - Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref AppAuthSecretArn
          - !Ref AWS::NoValue
        - DynamoDBCrudPolicy:
            TableName: !Ref AiUsageMetricsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AiUsageEventsTable
        - DynamoDBReadPolicy:
            TableName: !Ref AiPromptLimitSettingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OpenAiConversationStateTable
        - DynamoDBReadPolicy:
            TableName: !Ref EntitlementsTableName
        - !If
          - HasCollaborationTableName
          - Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CollaborationTableName}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CollaborationTableName}/index/*
          - !Ref AWS::NoValue
        - DynamoDBReadPolicy:
            TableName: !Ref AuthAccountsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthSessionsTableName
      Events:
        ProxyResponses:
          Type: HttpApi
          Properties:
            ApiId: !Ref LlmApi
            Path: /v1/llm/responses
            Method: POST
        V3ProxyResponses:
          Type: HttpApi
          Properties:
            ApiId: !Ref LlmApi
            Path: /v1/llm/v3/responses
            Method: POST
        PromptLimits:
          Type: HttpApi
          Properties:
            ApiId: !Ref LlmApi
            Path: /v1/llm/limits
            Method: GET
        ConversationEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref LlmApi
            Path: /v1/llm/conversation-events
            Method: POST

  V3LongRestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub mixroom-v3-long-${StageName}
      StageName: !Ref StageName
      EndpointConfiguration:
        Type: REGIONAL
      MethodSettings:
        - ResourcePath: /*
          HttpMethod: '*'
          MetricsEnabled: !If [ApiDetailedMetricsEnabledCondition, true, false]
          ThrottlingBurstLimit: !Ref V3LongApiThrottleBurstLimit
          ThrottlingRateLimit: !Ref V3LongApiThrottleRateLimit
      Cors:
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      DefinitionBody:
        swagger: '2.0'
        info:
          title: !Sub mixroom-v3-long-${StageName}
          version: '1.0'
        schemes:
          - https
        paths:
          /v1/llm/v3/responses:
            post:
              consumes:
                - application/json
              produces:
                - application/json
              responses:
                '200':
                  description: Lambda proxy response
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${V3LongResponsesFunction.Arn}/invocations
                timeoutInMillis: 65000

  V3LongResponsesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/api_responses_v3_rest.handler
      Timeout: 60
      Environment:
        Variables:
          AI_V3_TIMEOUT_SECONDS: 55
          AI_V3_MAX_PROVIDER_TIMEOUT_SECONDS: 55
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mixroom/*
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
                  kms:CallerAccount: !Ref AWS::AccountId
        - !If
          - HasOpenAiApiKeySecretArn
          - Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref OpenAiApiKeySecretArn
          - !Ref AWS::NoValue
        - !If
          - HasAppAuthSecretArn
          - Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref AppAuthSecretArn
          - !Ref AWS::NoValue
        - DynamoDBCrudPolicy:
            TableName: !Ref AiUsageMetricsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AiUsageEventsTable
        - DynamoDBReadPolicy:
            TableName: !Ref AiPromptLimitSettingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OpenAiConversationStateTable
        - DynamoDBReadPolicy:
            TableName: !Ref EntitlementsTableName
        - !If
          - HasCollaborationTableName
          - Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CollaborationTableName}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CollaborationTableName}/index/*
          - !Ref AWS::NoValue
        - DynamoDBReadPolicy:
            TableName: !Ref AuthAccountsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthSessionsTableName

  V3LongRestApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref V3LongResponsesFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${V3LongRestApi}/${StageName}/POST/v1/llm/v3/responses

  MixResolveFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/api_mix_resolve.handler
      Timeout: 15
      MemorySize: 1024
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mixroom/*
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
                  kms:CallerAccount: !Ref AWS::AccountId
        - !If
          - HasAppAuthSecretArn
          - Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref AppAuthSecretArn
          - !Ref AWS::NoValue
        - DynamoDBReadPolicy:
            TableName: !Ref AuthAccountsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthSessionsTableName
      Events:
        MixResolve:
          Type: HttpApi
          Properties:
            ApiId: !Ref LlmApi
            Path: /v1/mix/resolve
            Method: POST

  LlmApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmTopicArn
    Properties:
      AlarmName: !Sub mixroom-llm-proxy-${StageName}-api-5xx
      AlarmDescription: !Sub Prod LLM proxy API is returning 5XX responses in ${StageName}.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref LlmApi
        - Name: Stage
          Value: !Ref StageName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopicArn

  ProxyResponsesFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmTopicArn
    Properties:
      AlarmName: !Sub mixroom-llm-proxy-${StageName}-lambda-errors
      AlarmDescription: !Sub LLM proxy Lambda is returning errors in ${StageName}.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProxyResponsesFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopicArn

  ProxyResponsesFunctionThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmTopicArn
    Properties:
      AlarmName: !Sub mixroom-llm-proxy-${StageName}-lambda-throttles
      AlarmDescription: !Sub LLM proxy Lambda is throttling in ${StageName}.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProxyResponsesFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopicArn

  MixResolveFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmTopicArn
    Properties:
      AlarmName: !Sub mixroom-llm-proxy-${StageName}-mix-resolve-errors
      AlarmDescription: !Sub Mix resolve Lambda is returning errors in ${StageName}.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref MixResolveFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopicArn

Outputs:
  ApiBaseUrl:
    Description: Base URL for the LLM proxy API
    Value: !Sub https://${LlmApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
  V3LongApiBaseUrl:
    Description: Opt-in base URL for the isolated long-running V3 REST API
    Value: !Sub https://${V3LongRestApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
  AiUsageStateTableName:
    Value: !Ref AiUsageMetricsTable
  AiUsageEventsTableName:
    Value: !Ref AiUsageEventsTable
  AiPromptLimitSettingsTableName:
    Value: !Ref AiPromptLimitSettingsTable
  OpenAiConversationStateTableName:
    Value: !Ref OpenAiConversationStateTable
