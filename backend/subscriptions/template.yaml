AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Mixroom in-house subscriptions core (Apple/Google/Paddle/Toss)

Parameters:
  StageName:
    Type: String
    Default: staging
  EnforceSubscriptions:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  AllowStudioTier:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        BILLING_EVENTS_TABLE: !Ref BillingEventsTable
        SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTable
        ENTITLEMENTS_TABLE: !Ref EntitlementsCurrentTable
        CATALOG_MAPPINGS_TABLE: !Ref CatalogMappingsTable
        CUSTOMER_LINKS_TABLE: !Ref CustomerLinksTable
        PURCHASE_TOKENS_TABLE: !Ref PurchaseTokensTable
        RECONCILIATION_JOBS_TABLE: !Ref ReconciliationJobsTable
        PROJECTION_QUEUE_URL: !Ref BillingProjectionQueue
        ENFORCE_SUBSCRIPTIONS: !Ref EnforceSubscriptions
        ALLOW_STUDIO_TIER: !Ref AllowStudioTier

Resources:
  BillingApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub mixroom-subscriptions-${StageName}
      StageName: !Ref StageName
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Signature'"
        AllowOrigin: "'*'"

  BillingEventsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub mixroom-billing-events-dlq-${StageName}
      MessageRetentionPeriod: 1209600

  BillingProjectionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub mixroom-billing-projection-${StageName}
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt BillingEventsDlq.Arn
        maxReceiveCount: 6

  BillingEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub mixroom-billing-events-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_id
          AttributeType: S
        - AttributeName: provider_provider_event_id
          AttributeType: S
      KeySchema:
        - AttributeName: event_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: provider_event_idx
          KeySchema:
            - AttributeName: provider_provider_event_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub mixroom-subscriptions-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: subscription_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: subscription_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user_idx
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  EntitlementsCurrentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub mixroom-entitlements-current-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

  CatalogMappingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub mixroom-catalog-mappings-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: provider_product_key
          AttributeType: S
      KeySchema:
        - AttributeName: provider_product_key
          KeyType: HASH

  CustomerLinksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub mixroom-customer-links-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: provider_customer_key
          AttributeType: S
      KeySchema:
        - AttributeName: provider_customer_key
          KeyType: HASH

  PurchaseTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub mixroom-purchase-tokens-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: provider_token_hash
          AttributeType: S
      KeySchema:
        - AttributeName: provider_token_hash
          KeyType: HASH

  ReconciliationJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub mixroom-reconciliation-jobs-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH

  EntitlementApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/api_entitlements.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EntitlementsCurrentTable
      Events:
        EntitlementsMe:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/entitlements/me
            Method: get

  BillingApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/api_billing.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BillingEventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EntitlementsCurrentTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CatalogMappingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CustomerLinksTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PurchaseTokensTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt BillingProjectionQueue.QueueName
      Events:
        BillingCheckoutSession:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/billing/web/checkout-session
            Method: post
        BillingAppleVerify:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/billing/mobile/apple/verify
            Method: post
        BillingGoogleVerify:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/billing/mobile/google/verify
            Method: post
        BillingRestore:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/billing/restore
            Method: post
        BillingPortalUrl:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/billing/portal-url
            Method: get

  WebhooksFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/webhooks.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BillingEventsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt BillingProjectionQueue.QueueName
      Events:
        AppleWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/webhooks/apple
            Method: post
        GoogleWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/webhooks/google
            Method: post
        PaddleWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/webhooks/paddle
            Method: post
        TossWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref BillingApi
            Path: /v1/webhooks/toss
            Method: post

  ProjectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/projector.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BillingEventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EntitlementsCurrentTable
        - EventBridgePutEventsPolicy:
            EventBusName: default
      Events:
        ProjectionQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt BillingProjectionQueue.Arn
            BatchSize: 10

  ReconcileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/reconcile.handler
      Timeout: 120
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EntitlementsCurrentTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ReconciliationJobsTable
      Events:
        HourlyReconcile:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Name: !Sub mixroom-subscription-reconcile-${StageName}

Outputs:
  BillingApiUrl:
    Description: Base URL for Mixroom billing API
    Value: !Sub https://${BillingApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
  ProjectionQueueUrl:
    Value: !Ref BillingProjectionQueue
  BillingEventsTableName:
    Value: !Ref BillingEventsTable
