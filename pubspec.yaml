    - assets/instruments/VSCO-2-CE-1.1.0/Keys/Organ/Quiet/
    - assets/instruments/VSCO-2-CE-1.1.0/Keys/UprightPiano/
    - assets/instruments/VSCO-2-CE-1.1.0/Percussion/
    - assets/instruments/VSCO-2-CE-1.1.0/Percussion/Glock/
    - assets/instruments/VSCO-2-CE-1.1.0/Percussion/Marimba/
    - assets/instruments/VSCO-2-CE-1.1.0/Percussion/Xylo/
