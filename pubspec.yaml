name: mixroom
description: "Mixroom is the world's first AI-assisted music production app."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.2.4+41

environment:
  sdk: ^3.6.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  country_flags: ^2.0.0 # For country flags
  # video_editor: ^2.4.0
  # fraction: ^4.1.4
  # image_picker: ^1.1.2
  # path: ^1.8.2
  # video_player: ^2.6.1
  # ffmpeg_kit_flutter: ^6.0.3
  # video_editor_2: ^3.1.0
  # video_trimmer: ^4.0.2
  file_picker: ^10.3.3
  accessing_security_scoped_resource: ^3.4.0

  # (This might be unnecessary now, can just all use new_full) FFmpeg backend. (iOS = new_full, Android = 16kb) Switch with:
  #   dart run tool/switch_ffmpeg_backend.dart new_full
  #   dart run tool/switch_ffmpeg_backend.dart 16kb
  ffmpeg_kit_flutter_new_full: ^1.2.0
  # ffmpeg_kit_16kb: ^1.0.4

  flutter_file_dialog: ^3.0.2
  audio_waveforms: ^2.0.2 #deprecated
  fftea: ^1.5.0+1

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  permission_handler: ^11.4.0
  video_player: ^2.10.0
  audioplayers: ^6.4.0
  # python_shell: ^0.0.7
  google_fonts: ^6.2.1
  # flutter_blue_plus: ^1.35.3   // UNCOMMENT ONCE TO ENABLE BLUETOOTH FUNCTION
  # flutter_reactive_ble: ^5.4.0  // UNCOMMENT ONCE TO ENABLE BLUETOOTH FUNCTION
  # audio_service: ^0.18.17
  just_audio: ^0.9.46
  audio_session: ^0.1.13
  open_file: ^3.3.1
  better_player: ^0.0.83
  share_plus: ^11.0.0
  url_launcher: ^6.3.1
  flutter_gen: ^5.10.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  provider: ^6.1.4
  package_info_plus: ^8.3.1
  posthog_flutter: ^5.17.1
  sentry_flutter: ^9.14.0
  in_app_purchase: ^3.2.2
  in_app_purchase_android: ^0.4.0+8
  in_app_purchase_storekit: ^0.4.8
  video_thumbnail: ^0.5.3
  easy_video_editor: ^0.1.2

  googleapis: ^15.0.0
  googleapis_auth: ^2.0.0
  google_sign_in: ^7.2.0
  qr_flutter: ^4.1.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  flutter_appauth: ^10.0.0
  yt: ^2.2.6

  juce_audio_engine:
    path: juce_audio_engine
  flutter_neumorphic_plus: ^3.4.0
  path: ^1.9.1
  path_provider: ^2.1.5
  http: ^1.5.0
  image: ^4.5.4
  image_gallery_saver: ^2.0.3
  material_symbols_icons: ^4.2874.0
  flutter_svg: ^2.2.3
  flutter_webrtc: ^1.2.1
  record: ^6.1.2
  flutter_chat_ui: ^2.11.1
  flutter_chat_types: ^3.6.2
  flutter_chat_core: ^2.9.0
  # onnxruntime: ^1.4.1
  flutter_onnxruntime: ^1.6.1
  uuid: ^4.5.2
  collection: ^1.19.1
  archive: ^4.0.7
  crypto: ^3.0.6
  sign_in_with_apple: ^7.0.1
  kakao_flutter_sdk_user: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.2.14
  flutter_launcher_icons: ^0.13.1

# command to refresh: dart run flutter_native_splash:create
flutter_native_splash:
  fullscreen: true
  android: true
  ios: true
  background_image: assets/mixroom_launch_screen_native.png
  android_12:
    # Android 12+ requires a centered splash icon. Use a transparent 1x1 icon
    # so the full-screen background remains visible without a center mark.
    image: assets/android12_transparent.png
    icon_background_color: "#000000"
  # background_image:

  # command to refresh: dart run flutter_launcher_icons
flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon_shadow.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
