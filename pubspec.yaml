  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.2.14
  flutter_launcher_icons: ^0.13.1

# command to refresh: dart run flutter_native_splash:create
flutter_native_splash:
  fullscreen: true
  android: true
  ios: true
  image: assets/mixroom_logo202_home_4x.png #mixroom_logo_splash_big.png      # White transparent logo
  android_gravity: center
  ios_content_mode: center
  color: "#15498E" # "#0F1A2A" is darker color
  # background_image: assets/home_background.png  # Blurred guitar background

# command to refresh: dart run flutter_launcher_icons
flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/mixroom_app_icon_square.png" # "assets/mixroom_logo_202.png" #mixroom_icon_logo_noword.jpg"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  generate: true
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    - assets/impulse/church-small-trim.wav
    - assets/impulse/large-dark-plate-trim.wav
    - assets/explore_guitar.png
    - assets/home_background.png
    - assets/basic_icon.png
    - assets/pro_icon.png
    - assets/fading_w_logo.png
    - assets/fading_w_logo_crop.png
    - assets/tiktok_icon.png
    - assets/ig_icon.png
    - assets/youtube_icon.png
    - assets/soundcloud_icon.png
    - assets/mixroom_logo_202.png
    - assets/mixroom_logo202_home_4x.png
    - assets/mixroom_logo202_home.png
    - assets/magnet-solid-full.svg
    - assets/models/yamnet.onnx
    # - assets/models/gemma-2b-it-gpu-int4.bin
    # - assets/models/phi3-mini.gguf (don't use)
    # - assets/models/hammer-2.1-0.5b-gpu-int8.task
    # - assets/models/instrument_classifier.onnx

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700


