<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mixroom | Sign up</title>
    <meta
      name="description"
      content="Beta drops April 3rd. Mixroom doesn't create for you. It executes your intent."
    />
    <link rel="icon" href="/assets/favicon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="doc-page subscribe-page">
    <div class="site-bg" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand-link" href="/" aria-label="Mixroom home">
        <span class="brand-lockup">
          <img class="brand-icon" src="/assets/brand-mark.png" alt="" width="2616" height="1644" />
          <img class="brand-wordmark" src="/assets/wordmark.png" alt="Mixroom" width="4096" height="591" />
        </span>
      </a>
      <div class="header-actions">
        <nav class="site-nav" aria-label="Primary">
          <a href="/" data-i18n="nav.home">Home</a>
          <a href="/terms" data-i18n="nav.terms">Terms</a>
          <a href="/privacy" data-i18n="nav.privacy">Privacy</a>
        </nav>
        <div class="language-switcher" aria-label="Language selector">
          <button type="button" class="lang-button" data-lang-switch="en" aria-pressed="true">EN</button>
          <button type="button" class="lang-button" data-lang-switch="ko" aria-pressed="false">KO</button>
        </div>
      </div>
    </header>

    <main class="doc-shell subscribe-shell">
      <section class="subscribe-copy reveal">
        <p class="eyebrow" data-i18n="common.beta">Beta drops April 3rd.</p>
        <h1 data-i18n-html="subscribe.title">Mixroom doesn't create for you.<br />It executes your intent.</h1>
        <div class="hero-body">
          <p data-i18n="subscribe.body_1">You decide what you want. We make it real.</p>
          <p data-i18n="subscribe.body_2">Just your phone - and a conversation.</p>
        </div>
      </section>
      <form class="signup-form reveal" novalidate>
        <h2 data-i18n="common.beta">Beta drops April 3rd.</h2>
        <label>
          <span data-i18n="common.form_name">Name</span>
          <input name="name" autocomplete="name" required />
        </label>
        <label>
          <span data-i18n="common.form_email">Email*</span>
          <input name="email" type="email" autocomplete="email" required />
        </label>
        <label class="checkbox-row">
          <input name="newsletter" type="checkbox" required />
          <span data-i18n="common.form_newsletter">Yes, subscribe me to your newsletter.*</span>
        </label>
        <button type="submit" data-i18n="nav.signup">Sign up</button>
        <p class="form-feedback" aria-live="polite"></p>
      </form>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
