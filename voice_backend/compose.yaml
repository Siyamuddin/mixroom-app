services:
  backend:
    build: .
    image: mixroom-backend:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - mixroom-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.5
    stop_grace_period: 15s

volumes:
  mixroom-data:
